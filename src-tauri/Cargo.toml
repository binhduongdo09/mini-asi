[package]
name = "mini-asi"
version = "0.17.0"
edition = "2021"
description = "Mini-Asi — trợ lý sống quanh tai thỏ"
license = "Proprietary"

[lib]
name = "mini_asi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png", "unstable", "protocol-asset"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
regex = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
walkdir = "2"
cpal = "0.18"
hound = "3"
base64 = "0.22"
unicode-normalization = "0.1"
ureq = { version = "2", features = ["json"] }
asi-clean = { path = "../crates/asi-clean" }
notch-native = { path = "../crates/notch-native" }
license-tool = { path = "../crates/license-tool" }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
