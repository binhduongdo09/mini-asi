<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini-Asi</title>
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="island" class="mode-collapsed mood-idle" aria-label="Mini-Asi">
    <!-- Thanh trên cùng: cánh trái (linh vật) · khoảng tai thỏ · cánh phải (thông tin / nút) -->
    <div class="bar" id="bar">
      <div class="wing left">
        <div class="face" id="face">
          <span class="eye l"></span><span class="eye r"></span>
          <span class="zzz">z</span>
          <span class="vein"></span>
          <span class="drop"></span>
        </div>
      </div>
      <div class="notch-gap"></div>
      <div class="wing right" id="rightWing"></div>
    </div>

    <!-- Rê chuột: trạng thái + điều khiển nhanh -->
    <section class="layer" id="peek"></section>
    <!-- Nhắc việc / nghỉ mắt / lịch / nhật ký -->
    <section class="layer" id="alert"></section>
    <!-- Lệnh giọng nói: đang nghe / Asi trả lời -->
    <section class="layer" id="listen"></section>
    <section class="layer" id="reply"></section>
    <!-- Kéo file vào: trái = AirDrop · phải = công cụ file -->
    <section class="layer" id="drop">
      <div class="drop-half" data-zone="airdrop"><span class="drop-ic" data-i="airdrop"></span><b>AirDrop</b><span>Thả để gửi ngay</span></div>
      <div class="drop-half" data-zone="tools"><span class="drop-ic" data-i="zip"></span><b>Công cụ file</b><span>Nén · PDF · Đổi định dạng</span></div>
      <div class="drop-half drop-one" data-zone="capture"><span class="drop-ic" data-i="cal"></span><b>Tạo việc · lịch</b><span>Thả chữ, ảnh, link, danh bạ…</span></div>
    </section>
    <!-- Bảng tạo việc / sự kiện từ nội dung vừa thả -->
    <section class="layer" id="capture"></section>
    <!-- Tấm công cụ file sau khi thả -->
    <section class="layer" id="sheet"></section>

    <!-- Bảng chính -->
    <section class="layer" id="panel">
      <nav class="tabs" id="tabs"></nav>
      <div class="view" id="view"></div>
    </section>

    <div class="accent" id="accent"></div>
    <div class="confetti" id="confetti"></div>
  </div>
  <script src="i18n-en.js"></script>
  <script src="i18n.js"></script>
  <script src="icons.js"></script>
  <script src="vnkey.js"></script>
  <script src="common.js"></script>
  <script src="app.js"></script>
  <script src="views.js"></script>
  <script src="extra.js"></script>
  <script src="meeting.js"></script>
  <script src="vocab.js"></script>
</body>
</html>
