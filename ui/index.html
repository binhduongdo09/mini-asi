<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini-Asi</title>
  <link rel="stylesheet" href="base.css?v=29" />
  <link rel="stylesheet" href="style.css?v=29" />
</head>
<body>
  <div id="island" class="mode-collapsed mood-idle" aria-label="Mini-Asi">
    <!-- Thanh trên cùng: cánh trái (linh vật) · khoảng tai thỏ · cánh phải (thông tin / nút) -->
    <div class="bar" id="bar">
      <div class="wing left">
        <div class="face" id="face">
          <span class="eye l"></span><span class="eye r"></span>
          <span class="zzz">z</span>
          <span class="vein"></span>
          <span class="drop"></span>
        </div>
      </div>
      <div class="notch-gap"></div>
      <div class="wing right" id="rightWing"></div>
    </div>

    <!-- Rê chuột: trạng thái + điều khiển nhanh -->
    <section class="layer" id="peek"></section>
    <!-- Nhắc việc / nghỉ mắt / lịch / nhật ký -->
    <section class="layer" id="alert"></section>
    <!-- Lệnh giọng nói: đang nghe / Asi trả lời -->
    <section class="layer" id="listen"></section>
    <section class="layer" id="reply"></section>
    <!-- Kéo file hoặc nội dung vào: không gian Quick Action xử lý định dạng -->
    <section class="layer" id="drop">
      <div class="drop-box">
        <div class="drop-head">
          <span class="drop-ico" data-i="file"></span>
          <div class="drop-txt">
            <div class="drop-title">Thả vào để xử lý nhanh</div>
            <div class="drop-sub">Tự nhận diện định dạng file hoặc nội dung bạn thả vào</div>
          </div>
        </div>
        <div class="drop-chips">
          <span class="drop-chip">Ảnh → JPG · PNG · HEIC · PDF</span>
          <span class="drop-chip">Văn bản → PDF</span>
          <span class="drop-chip">Gộp &amp; Nén PDF</span>
          <span class="drop-chip">Nén / Giải nén ZIP</span>
          <span class="drop-chip">Tạo việc · Lịch</span>
        </div>
      </div>
    </section>
    <!-- Bảng tạo việc / sự kiện từ nội dung vừa thả -->
    <section class="layer" id="capture"></section>
    <!-- Tấm công cụ file sau khi thả -->
    <section class="layer" id="sheet"></section>

    <!-- Bảng chính -->
    <section class="layer" id="panel">
      <nav class="tabs" id="tabs"></nav>
      <div class="view" id="view"></div>
    </section>

    <div class="accent" id="accent"></div>
    <div class="confetti" id="confetti"></div>
  </div>
  <script src="i18n-en.js?v=29"></script>
  <script src="i18n.js?v=29"></script>
  <script src="icons.js?v=29"></script>
  <script src="vnkey.js?v=29"></script>
  <script src="common.js?v=29"></script>
  <script src="app.js?v=29"></script>
  <script src="views.js?v=29"></script>
  <script src="extra.js?v=29"></script>
  <script src="meeting.js?v=29"></script>
  <script src="vocab.js?v=29"></script>
</body>
</html>
