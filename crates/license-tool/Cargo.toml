[package]
name = "license-tool"
version = "0.1.0"
edition = "2021"
description = "Mini-Asi: tạo & xác thực khoá bản quyền Pro (ed25519, offline)"
license = "Proprietary"

[lib]
name = "masi_license"
path = "src/lib.rs"

[[bin]]
name = "masi-license"
path = "src/main.rs"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
